<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="أنا أقدر! منصة لأولياء أمور مدارس الأندلس العالمية فرع أبحر لتنمية استقلالية الطفل في البيت.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{height:100%}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>أنا أقدر!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app shell — sticky header, single column of views, fixed bottom tab bar */
:root{
  --navy:#1D2D5C; --blue:#3F7FD8; --yellow:#F6C343; --coral:#F27F6B; --mint:#4DB8A4; --plum:#8C6BC9;
  --bg:#F4F7FC; --surface:#FFFFFF; --soft:#EAF0FA; --ink:#1B2443; --muted:#5D6787; --line:#DCE3F0;
  --on-accent:#FFFFFF; --shadow:0 6px 18px rgba(29,45,92,.08);
  --f-display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#9DB6F5; --blue:#6EA0EC; --yellow:#F6CB5E; --coral:#F49584; --mint:#6CCBB8; --plum:#AE93E0;
  --bg:#10162A; --surface:#19213B; --soft:#222C4B; --ink:#EDF1FB; --muted:#A3ADCB; --line:#2E3A60;
  --on-accent:#10162A; --shadow:0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#9DB6F5; --blue:#6EA0EC; --yellow:#F6CB5E; --coral:#F49584; --mint:#6CCBB8; --plum:#AE93E0;
  --bg:#10162A; --surface:#19213B; --soft:#222C4B; --ink:#EDF1FB; --muted:#A3ADCB; --line:#2E3A60;
  --on-accent:#10162A; --shadow:0 6px 18px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
#app{min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.3;margin:0;text-wrap:balance;color:var(--ink)}
h1{font-size:1.9rem;font-weight:800}
h2{font-size:1.4rem;font-weight:700}
h3{font-size:1.12rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:10px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.slogo{height:92px;width:auto;max-width:100%;display:block;background:none;border:0}
.sitefoot{background:#FFFFFF;border-top:1px solid #DCE3F0;margin-top:28px}
.sitefoot .wrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding-block:22px}
.sitefoot p{color:#5D6787;font-size:.82rem}

header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:var(--yellow);display:grid;place-items:center;flex-shrink:0}
.logo svg{width:24px;height:24px}
.brand b{font-family:var(--f-display);font-size:1.25rem;font-weight:800;color:var(--navy);display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.74rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kidchip{display:flex;align-items:center;gap:6px;background:var(--soft);border:0;border-radius:999px;padding:4px 6px 4px 12px;font-weight:600;font-size:.88rem;max-width:45%}
.kidchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--coral);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;flex-shrink:0}

main .wrap{display:flex;flex-direction:column;gap:22px;padding-block:20px 8px}
section{display:flex;flex-direction:column;gap:12px}
.sub{color:var(--muted);font-size:.94rem;max-width:62ch}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.02em;color:var(--blue)}

.hero{background:var(--navy);color:#fff;border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
:root .hero{background:#1D2D5C}
.hero h1{color:#fff}
.hero p{color:#D7E0F6;max-width:52ch}
.hero .dots{position:absolute;inset-inline-start:-30px;bottom:-40px;width:150px;height:150px;border-radius:50%;background:#F6C343;opacity:.95}
.hero .dots2{position:absolute;inset-inline-start:70px;bottom:-60px;width:90px;height:90px;border-radius:50%;background:#F27F6B}
.hero > *:not(.dots):not(.dots2){position:relative;z-index:1}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.hstat{background:rgba(255,255,255,.12);border-radius:14px;padding:8px 12px;min-width:84px}
.hstat b{font-family:var(--f-display);font-size:1.4rem;display:block;line-height:1.1;color:#fff;font-variant-numeric:tabular-nums}
.hstat small{color:#C9D4F0;font-size:.76rem}

.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--blue);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.y{background:#F6C343;color:#1D2D5C}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.88rem;border-radius:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.today{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center}
.bigstar{width:56px;height:56px;border-radius:18px;background:#F6C343;display:grid;place-items:center}
.bigstar svg{width:32px;height:32px}

.worlds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.worlds{grid-template-columns:repeat(4,minmax(0,1fr))}}
.wcard{border:0;text-align:start;border-radius:20px;padding:14px;background:var(--wt);display:flex;flex-direction:column;gap:8px;min-height:150px;position:relative}
.wcard .ic{width:44px;height:44px;border-radius:14px;background:var(--wc);display:grid;place-items:center}
.wcard .ic svg{width:26px;height:26px;stroke:#fff}
.wcard b{font-family:var(--f-display);font-size:1.06rem;line-height:1.3;color:var(--ink)}
.wcard small{color:var(--muted);font-size:.78rem;margin-top:auto}
.meter{height:7px;border-radius:9px;background:color-mix(in srgb,var(--wc) 20%,transparent);overflow:hidden}
.meter i{display:block;height:100%;background:var(--wc);border-radius:9px}

.whead{border-radius:24px;padding:20px;background:var(--wt);display:flex;flex-direction:column;gap:10px}
.whead .ic{width:56px;height:56px;border-radius:18px;background:var(--wc);display:grid;place-items:center}
.whead .ic svg{width:32px;height:32px;stroke:#fff}
.back{background:none;border:0;color:var(--blue);font-weight:700;padding:4px 0;align-self:flex-start;display:flex;align-items:center;gap:4px}

.skills{display:flex;flex-direction:column;gap:10px}
.skill{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.skill-top{display:flex;gap:10px;align-items:flex-start}
.skill-top p{flex:1;font-weight:600;min-width:0}
.pin{border:0;background:var(--soft);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.pin svg{width:20px;height:20px;stroke:var(--muted);fill:none}
.pin.on{background:#F6C343}
.pin.on svg{stroke:#1D2D5C;fill:#1D2D5C}
.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.lv{border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:6px 4px;font-size:.72rem;line-height:1.35;font-weight:600;color:var(--muted);min-height:48px}
.lv.on{color:var(--on-accent);border-color:transparent}
.lv.on.l1{background:var(--coral)} .lv.on.l2{background:var(--plum)} .lv.on.l3{background:var(--blue)} .lv.on.l4{background:var(--mint)}
.skill-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%}

.chal{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.chal .t{font-family:var(--f-display);font-weight:700;font-size:1.08rem}
.chal small{color:var(--muted)}
.chal.done{background:color-mix(in srgb,var(--mint) 14%,var(--surface));border-color:color-mix(in srgb,var(--mint) 45%,var(--line))}
.donebtn{border:0;border-radius:14px;min-width:96px;min-height:46px;padding:8px 12px;font-weight:700;background:#F6C343;color:#1D2D5C;display:flex;align-items:center;gap:6px;justify-content:center}
.chal.done .donebtn{background:var(--mint);color:var(--on-accent)}
.donebtn svg{width:18px;height:18px}

.sitlist{display:flex;flex-direction:column;gap:10px}
.sit{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 16px;text-align:start;display:flex;align-items:center;gap:12px;font-weight:600}
.sit::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--coral);flex-shrink:0}
.sit span{flex:1}

.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.badges{grid-template-columns:repeat(4,minmax(0,1fr))}}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.medal{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--soft);position:relative}
.medal svg{width:40px;height:40px}
.badge.got .medal{background:var(--bc)}
.badge b{font-family:var(--f-display);font-size:1rem}
.badge small{color:var(--muted);font-size:.78rem;line-height:1.5}
.badge:not(.got){opacity:.75}
.badge:not(.got) .medal svg{opacity:.35}

.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.statgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{border-radius:18px;padding:14px;background:var(--surface);border:1px solid var(--line)}
.stat b{font-family:var(--f-display);font-size:1.8rem;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:.82rem}
.stat.s4 b{color:var(--mint)} .stat.s3 b{color:var(--blue)} .stat.s1 b{color:var(--coral)} .stat.sc b{color:#C9932A}
.wbar{display:grid;grid-template-columns:minmax(0,9rem) 1fr 2.6rem;gap:10px;align-items:center;font-size:.88rem}
.wbar .meter{height:10px}
.wbar em{font-style:normal;color:var(--muted);text-align:end;font-variant-numeric:tabular-nums}
.taglist{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.82rem;border-radius:999px;padding:4px 10px;background:var(--soft)}
.empty{color:var(--muted);font-size:.9rem}

.form{display:flex;flex-direction:column;gap:12px}
.form label{font-weight:600;font-size:.92rem;display:flex;flex-direction:column;gap:6px}
.form input,.form select{font:inherit;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;min-height:46px}
.ages{display:flex;gap:8px;flex-wrap:wrap}
.ages button{border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:8px 16px;font-weight:700}
.ages button.on{background:var(--blue);color:var(--on-accent);border-color:transparent}

.track{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.track button{border:1.5px dashed var(--line);background:transparent;border-radius:12px;aspect-ratio:1;display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--muted);max-width:100%;padding:0}
.track button.on{background:#F6C343;border:0;color:#1D2D5C}
.note{background:color-mix(in srgb,var(--yellow) 22%,var(--surface));border-radius:16px;padding:14px;font-size:.92rem}
ul.clean{margin:0;padding-inline-start:1.2em;display:flex;flex-direction:column;gap:6px}
ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
ol.steps li{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;counter-increment:s}
ol.steps li::before{content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--blue);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.say{border-inline-start:4px solid var(--coral);background:var(--soft);border-radius:12px;padding:10px 12px;font-weight:600}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,35,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-head{position:sticky;top:0;background:var(--bg);padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);z-index:1}
.sheet-head h2{flex:1;font-size:1.25rem}
.x{border:0;background:var(--soft);width:40px;height:40px;border-radius:12px;font-size:1.3rem;line-height:1;flex-shrink:0}
.sheet-body{padding:16px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.blk h3{font-size:1rem;color:var(--navy)}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.meta span{background:var(--soft);border-radius:999px;padding:4px 12px;font-size:.84rem;font-weight:600}

nav.tabs{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);z-index:20;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:12px}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--blue);background:var(--soft)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:700;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.cheer{position:fixed;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none}
.cheer div{background:#F6C343;color:#1D2D5C;border-radius:28px;padding:26px 30px;text-align:center;font-family:var(--f-display);font-size:1.6rem;font-weight:800;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:pop .9s ease both}
.cheer svg{width:64px;height:64px;display:block;margin:0 auto 6px}
@keyframes pop{0%{transform:scale(.6);opacity:0}30%{transform:scale(1.08);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.cheer div{animation:none}}
.report{white-space:pre-wrap;font-size:.88rem;background:var(--soft);border-radius:14px;padding:12px;max-height:240px;overflow:auto}
footer.small{color:var(--muted);font-size:.78rem;text-align:center;padding-block:8px 0}
</style>

<div id="app">
  <header class="top"><div class="wrap">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="#1D2D5C"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></div>
      <div style="min-width:0"><b>أنا أقدر!</b><small>رحلتي نحو الاستقلالية</small></div>
    </div>
    <button class="kidchip" id="kidchip" hidden><span id="kidname"></span><i class="avatar" id="kidav"></i></button>
  </div></header>
  <main><div class="wrap" id="view"></div>
  <footer class="sitefoot"><div class="wrap"><img id="ftLogo" class="slogo" alt="شعار مدارس الأندلس العالمية، فرع أبحر" width="160" height="92"><p>المعلمة: رغد الأحمدي</p></div></footer></main>
  <nav class="tabs" id="tabs" hidden><div class="in"></div></nav>
</div>
<div id="layer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>

const kid=()=>S.kids.find(k=>k.id===S.cur);
const pad=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const wkey=()=>{const d=new Date();d.setDate(d.getDate()-d.getDay());return dkey(d)};

function newKid(name,age,sample){
  const k={id:'k'+Date.now(),name,age,start:dkey(),lv:{},focus:{},done:{},log:[],bridge:{}};
  if(sample){
    Object.assign(k.lv,{'0-0':4,'0-1':4,'0-3':3,'0-7':2,'0-11':4,'1-0':4,'1-2':4,'1-7':3,'2-0':2,'2-3':3,'3-3':1,'3-4':2,'4-3':2,'5-7':4,'5-2':3,'7-1':2});
    k.focus={'0-7':1,'2-0':1,'3-3':1};
    const d=new Date();d.setDate(d.getDate()-1);
    k.done={[`d:${dkey(d)}:d1`]:1,[`d:${dkey(d)}:d2`]:1,[`w:${wkey()}:w2`]:1};
    k.log=[{s:'0-0',f:3,t:4,d:dkey(d)},{s:'1-0',f:3,t:4,d:dkey(d)},{s:'0-3',f:2,t:3,d:dkey(d)}];
    k.sample=1;
  }
  S.kids.push(k);S.cur=k.id;save();
}

function suggestion(k){
  let pool=Object.keys(k.focus).filter(s=>(k.lv[s]||0)<4);
  if(!pool.length){pool=[];W.forEach((w,i)=>w.s.forEach((_,j)=>{if((k.lv[`${i}-${j}`]||0)<4)pool.push(`${i}-${j}`)}))}
  if(!pool.length)return null;
  const day=Math.floor(Date.now()/864e5);return pool[day%pool.length];
}

function setLevel(key,l){
  const k=kid(),old=k.lv[key]||0;
  if(old===l){delete k.lv[key]}else{k.lv[key]=l;if(l>old)k.log.push({s:key,f:old,t:l,d:dkey()});}
  const before=earned(k).length;save();
  if(earned(k).length>before)cheer('شارة جديدة!');else if(l===4&&old!==4)cheer('باستقلالية!');
}

function coach(key){
  const[i,j]=key.split('-').map(Number),w=W[i],s=w.s[j],steps=CUSTOM[s]||GEN(s),k=kid();

/* ---------- PDF report ---------- */
let dl={save:async({filename,data})=>{const url=URL.createObjectURL(data);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return{status:'saved'}}};

async function downloadReport(k,btn){
  if(!dl){toast('تحميل التقرير غير متاح هنا');return}
  const label=btn.textContent;btn.disabled=true;btn.textContent='جاري تجهيز التقرير…';
  try{
    const blob=await buildPdf(k);
    await dl.save({filename:`تقرير استقلالية ${k.name}.pdf`,data:blob});
    toast('تم تحميل التقرير');
  }catch(e){
    const c=e&&e.code;
    if(c==='declined'){}
    else if(c==='rate_limited')toast('انتظري قليلًا ثم حاولي مرة أخرى');
    else if(c==='host_unavailable')toast('افتحي الرابط من المتصفح لتحميل التقرير');
    else toast('تعذّر تجهيز التقرير، حاولي مرة أخرى');
  }finally{btn.disabled=false;btn.textContent=label}
}

async function buildPdf(k){
  const FD='"Baloo Bhaijaan 2","IBM Plex Sans Arabic",Tahoma,sans-serif',FB='"IBM Plex Sans Arabic",Tahoma,sans-serif';
  try{await Promise.all(['800 40px "Baloo Bhaijaan 2"','700 40px "Baloo Bhaijaan 2"','400 20px "IBM Plex Sans Arabic"','600 20px "IBM Plex Sans Arabic"','700 20px "IBM Plex Sans Arabic"'].map(f=>document.fonts.load(f,'أبجد ١٢٣')))}catch(e){}
  const C={navy:'#1D2D5C',blue:'#3F7FD8',yellow:'#F6C343',coral:'#F27F6B',mint:'#4DB8A4',plum:'#8C6BC9',ink:'#1B2443',muted:'#5D6787',line:'#DCE3F0',soft:'#EEF3FB',gold:'#E0A92C'};
  const WC=[C.blue,C.coral,C.mint,C.gold,C.plum,C.coral,C.blue,C.mint];
  const PW=1240,PH=1754,M=90,R=PW-M,FOOT=PH-110;
  const logo=new Image();logo.src=LOGO;try{await logo.decode()}catch(e){}
  const LA=logo.naturalWidth?logo.naturalWidth/logo.naturalHeight:640/368;
  const drawLogo=(x,yy,h)=>{if(logo.naturalWidth)ctx.drawImage(logo,x,yy,h*LA,h)};
  const pages=[];let ctx,y;
  const font=(w,sz,f)=>{ctx.font=`${w} ${sz}px ${f||FB}`};
  const rr=(x,yy,w,h,r)=>{ctx.beginPath();ctx.moveTo(x+r,yy);ctx.arcTo(x+w,yy,x+w,yy+h,r);ctx.arcTo(x+w,yy+h,x,yy+h,r);ctx.arcTo(x,yy+h,x,yy,r);ctx.arcTo(x,yy,x+w,yy,r);ctx.closePath()};
  const text=(t,x,yy,align)=>{ctx.textAlign=align||'right';ctx.fillText(t,x,yy)};
  const wrap=(t,maxW)=>{const words=String(t).split(' '),out=[];let line='';words.forEach(w=>{const tr=line?line+' '+w:w;if(ctx.measureText(tr).width>maxW&&line){out.push(line);line=w}else line=tr});if(line)out.push(line);return out};
  function newPage(first){
    const cv=document.createElement('canvas');cv.width=PW;cv.height=PH;ctx=cv.getContext('2d');ctx.direction='rtl';ctx.textBaseline='alphabetic';
    ctx.fillStyle='#fff';ctx.fillRect(0,0,PW,PH);pages.push(cv);
    if(first){
      drawLogo(M,50,170);
      ctx.fillStyle=C.navy;font(800,58,FD);text('تقرير استقلالية طفلي',R,112);
      ctx.fillStyle=C.blue;font(700,32,FD);text('أنا أقدر! · رحلتي نحو الاستقلالية',R,168);
      ctx.fillStyle=C.muted;font(500,26);text('مدارس الأندلس العالمية · فرع أبحر',R,212);
      const seg=(PW-2*M)/4;[C.blue,C.coral,C.yellow,C.navy].forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(M+i*seg,262,seg,10)});
      y=360;
    }else{
      drawLogo(M,44,96);
      ctx.fillStyle=C.navy;font(700,32,FD);text(`تقرير استقلالية ${k.name}`,R,104);
      ctx.fillStyle=C.line;ctx.fillRect(M,166,PW-2*M,2);y=240;
    }
  }
  const need=h=>{if(y+h>FOOT-30)newPage(false)};
  const heading=(t,col)=>{need(90);ctx.fillStyle=col||C.navy;ctx.beginPath();ctx.arc(R-10,y-12,10,0,Math.PI*2);ctx.fill();ctx.fillStyle=C.ink;font(700,34,FD);text(t,R-34,y);y+=50};

  const by={1:[],2:[],3:[],4:[]};Object.entries(k.lv).forEach(([s,v])=>by[v].push(s));
  const dOpt={day:'numeric',month:'long',year:'numeric'};
  const today=new Date().toLocaleDateString('ar-SA-u-ca-gregory',dOpt);
  const since=new Date(k.start+'T12:00').toLocaleDateString('ar-SA-u-ca-gregory',dOpt);

  newPage(true);
  ctx.fillStyle=C.ink;font(800,52,FD);text(k.name,R,y);y+=52;
  ctx.fillStyle=C.muted;font(500,26);text(`العمر: ${ar(k.age)} سنوات  ·  تاريخ التقرير: ${today}  ·  بداية المتابعة: ${since}`,R,y);y+=60;

  const stats=[[by[4].length,'أتقنها باستقلالية',C.mint],[by[3].length+by[2].length,'يتدرب عليها',C.blue],[by[1].length,'تحتاج دعمًا إضافيًا',C.coral],[stars(k),'تحديًا أنجزه',C.gold]];
  const gap=24,bw=(PW-2*M-3*gap)/4,bh=150;
  stats.forEach(([n,l,c],i)=>{const x=R-bw-i*(bw+gap);ctx.fillStyle=C.soft;rr(x,y,bw,bh,22);ctx.fill();ctx.fillStyle=c;rr(x+bw-10,y+20,10,bh-40,5);ctx.fill();
    ctx.fillStyle=c;font(800,68,FD);text(ar(n),x+bw-32,y+82);ctx.fillStyle=C.ink;font(600,24);text(l,x+bw-32,y+124)});
  y+=bh+50;

  const prog=new Set(k.log.map(x=>x.s)).size,bad=earned(k).map(b=>b.n);
  ctx.fillStyle='#FDF3D6';const nl=[`تقدّم ${k.name} مستوى أو أكثر في ${ar(prog)} مهارة منذ بداية المتابعة.`,`الشارات: ${bad.length?bad.join('، '):'لم يحصل على شارة بعد، وكل محاولة تقرّبه منها.'}`];
  font(600,26);const nlines=nl.flatMap(t=>wrap(t,PW-2*M-60));const nh=nlines.length*40+40;rr(M,y,PW-2*M,nh,20);ctx.fill();
  ctx.fillStyle=C.navy;nlines.forEach((l,i)=>text(l,R-30,y+52+i*40));y+=nh+60;

  heading('التقدم في كل عالم');
  W.forEach((w,i)=>{need(58);const s=worldStats(k,i);ctx.fillStyle=C.ink;font(600,26);text(`عالم ${w.n}`,R,y);
    const bl=M+100,br=R-330,bww=br-bl;ctx.fillStyle=C.soft;rr(bl,y-22,bww,22,11);ctx.fill();
    if(s.pct>0){const fw=Math.max(22,bww*s.pct/100);ctx.fillStyle=WC[i];rr(br-fw,y-22,fw,22,11);ctx.fill()}
    ctx.fillStyle=C.muted;font(700,26);text(`${ar(s.pct)}٪`,M,y,'left');y+=58});
  y+=30;

  const groups=[[4,'يستطيع باستقلالية',C.mint],[3,'يستطيع مع تذكير بسيط',C.blue],[2,'يستطيع بمساعدة وتوجيه',C.plum],[1,'يحتاج إلى مساعدة كاملة',C.coral]];
  groups.forEach(([l,t,c])=>{
    heading(`${t} (${ar(by[l].length)})`,c);
    font(400,25);
    if(!by[l].length){ctx.fillStyle=C.muted;text('لا توجد مهارات في هذا المستوى حاليًا.',R-34,y);y+=60;return}
    const colW=(PW-2*M-60)/2-40,items=by[l].map(s=>wrap(sname(s),colW));
    for(let i=0;i<items.length;i+=2){
      const a=items[i],b=items[i+1]||[],h=Math.max(a.length,b.length)*36+14;need(h);
      [[a,R-34],[b,R-34-(PW-2*M)/2]].forEach(([ls,x])=>{if(!ls.length)return;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x-6,y-9,6,0,Math.PI*2);ctx.fill();ctx.fillStyle=C.ink;font(400,25);ls.forEach((ln,j)=>text(ln,x-24,y+j*36))});
      y+=h;
    }
    y+=34;
  });

  need(150);ctx.fillStyle=C.soft;font(500,24);const tip=wrap('نصيحة: ركّزي هذا الأسبوع على مهارة واحدة من المهارات التي يتدرب عليها، وامدحي المحاولة قبل النتيجة.',PW-2*M-60);
  const th=tip.length*36+36;rr(M,y,PW-2*M,th,20);ctx.fill();ctx.fillStyle=C.navy;tip.forEach((l,i)=>text(l,R-30,y+46+i*36));

  pages.forEach((cv,i)=>{const c=cv.getContext('2d');c.direction='rtl';c.fillStyle=C.line;c.fillRect(M,FOOT,PW-2*M,2);c.fillStyle=C.muted;c.font=`500 22px ${FB}`;c.textAlign='right';c.fillText('المعلمة: رغد الأحمدي · مدارس الأندلس العالمية · فرع أبحر',R,FOOT+44);c.textAlign='left';c.fillText(`صفحة ${ar(i+1)} من ${ar(pages.length)}`,M,FOOT+44)});

  const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'pt',format:'a4',compress:true});
  pages.forEach((cv,i)=>{if(i)pdf.addPage();pdf.addImage(cv.toDataURL('image/jpeg',0.9),'JPEG',0,0,595.28,841.89)});
  return pdf.output('blob');
}
function grp(t,c,arr){return `<section class="panel"><h3 style="color:${c}">${t} (${ar(arr.length)})</h3>${arr.length?`<div class="taglist">${arr.map(s=>`<button class="tag" style="border:0" data-coach="${s}">${esc(sname(s))}</button>`).join('')}</div>`:'<p class="empty">لا توجد مهارات هنا بعد. قيّمي المهارات من داخل العوالم.</p>'}</section>`}

/* ---------- router ---------- */
let route='home';
function go(r){route=r;try{history.replaceState(null,'',r==='home'?location.pathname+location.search:'#'+r)}catch(e){}render();window.scrollTo(0,0)}
function render(){
  const k=kid();
  if(!k&&route!=='setup')route='setup';
  $('#kidchip').hidden=!k;
  if(k){$('#kidname').textContent=k.name;$('#kidav').textContent=k.name.trim()[0]||'؟'}
  renderTabs(route);
  if(route==='setup')vSetup(false);
  else if(route==='setup-edit')vSetup(true);
  else if(route==='worlds')vWorlds();
  else if(route.startsWith('w-'))vWorld(+route.slice(2));
  else if(route==='challenges')vChallenges();
  else if(route==='whatif')vWhatif();
  else if(route==='card')vCard();
  else if(route==='bridge')vBridge();
  else if(route==='badges')vBadges();
  else vHome();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-coach],[data-lv],[data-pin],[data-done],[data-sit]');if(!t)return;
  if(t.dataset.go){closeSheet();go(t.dataset.go)}
  else if(t.dataset.coach)coach(t.dataset.coach);
  else if(t.dataset.lv){setLevel(t.dataset.lv,+t.dataset.l);render()}
  else if(t.dataset.pin){const k=kid(),p=t.dataset.pin;if(k.focus[p])delete k.focus[p];else{k.focus[p]=1;toast('أُضيفت إلى خطة طفلك')}save();render()}
  else if(t.dataset.done){toggleDone(t.dataset.done);render()}
  else if(t.dataset.sit)sit(+t.dataset.sit);
});
$('#kidchip').onclick=()=>go('setup-edit');
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
const valid=h=>/^(home|worlds|w-[0-7]|challenges|whatif|card|bridge|badges|setup-edit)$/.test(h);
const h0=location.hash.slice(1);route=valid(h0)?h0:'home';
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(valid(h)&&h!==route){route=h;render()}});
render();
</script>

</body>
</html>
